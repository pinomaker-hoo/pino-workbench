name: Native desktop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: go mod download
      - run: go vet ./...
      - run: go test -race ./internal/model ./internal/vault ./internal/runner ./internal/connectors
      - run: go test ./internal/ui
      - run: go build -trimpath -o build/ ./cmd/pino
      - uses: actions/upload-artifact@v4
        with:
          name: pino-${{ runner.os }}
          path: build/
